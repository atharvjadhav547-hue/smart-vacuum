<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensors</title>
    <link rel="stylesheet" href="sensors.css">
</head>

<body>

<header>
    <a href="index.html">← Home</a>
    <h1>📡 Sensors</h1>
</header>

<main>

    <div class="sensor-card">
        <h2>🚧 Obstacle Sensor</h2>
        <p>Status: <strong id="obstacle">CLEAR</strong></p>
    </div>

    <div class="sensor-card">
        <h2>📏 Distance</h2>
        <p><strong id="distance">120 cm</strong></p>
    </div>

    <div class="sensor-card">
        <h2>🔋 Battery</h2>
        <p><strong id="battery">85%</strong></p>
    </div>

</main>

<script src="sensors.js"></script>

</body>
